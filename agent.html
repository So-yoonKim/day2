<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제주 귤 에이전트</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: sans-serif;
      background: #fff8ee;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header { background: #ff9f1c; color: #fff; padding: 0.9rem 1rem; font-weight: bold; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .bubble {
      max-width: 75%;
      padding: 0.6rem 0.9rem;
      border-radius: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .me { align-self: flex-end; background: #ff9f1c; color: #fff; border-bottom-right-radius: 4px; }
    .bot { align-self: flex-start; background: #fff; color: #333; border-bottom-left-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
    form { display: flex; gap: 0.5rem; padding: 0.75rem; background: #fff; border-top: 1px solid #eee; }
    input { flex: 1; padding: 0.6rem; font-size: 1rem; border: 1px solid #ccc; border-radius: 8px; }
    button { padding: 0.6rem 1.2rem; font-size: 1rem; border: 0; border-radius: 8px; background: #ff9f1c; color: #fff; cursor: pointer; }
    .note { text-align: center; font-size: 0.7rem; color: #999; padding: 0.3rem 0 0.5rem; background: #fff; }
  </style>
</head>
<body>
  <header>🍊 제주 귤 에이전트</header>
  <div id="chat"></div>
  <form id="form">
    <input id="input" placeholder="메시지를 입력하세요" autocomplete="off">
    <button type="submit">보내기</button>
  </form>
  <div class="note">※ 지금 답변은 미리 정해 둔 가짜 답이에요.</div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const replies = [
      '안녕하세요, 김소윤 님! 🍊 제주 귤 종류를 알아봐 드리는 에이전트예요. 어떤 귤이 궁금하세요? 맛, 재배 시기, 새로운 품종 중에 골라 주세요!',
      '단맛이 진한 귤을 좋아하신다면 한라봉이나 레드향을 추천해요. 겨울에서 초봄에 특히 맛있어요!',
      '아직 공부 중이에요! 5일차에 진짜로 알아볼게요.'
    ];
    let turn = 0;

    function addBubble(text, who) {
      const div = document.createElement('div');
      div.className = 'bubble ' + who;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    document.getElementById('form').addEventListener('submit', e => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      addBubble(text, 'me');
      input.value = '';
      const reply = replies[turn % replies.length];
      turn++;
      setTimeout(() => addBubble(reply, 'bot'), 1000);
    });
  </script>
</body>
</html>
