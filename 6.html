<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function plus(a,b){
            return a+b
        }

        function minus(a,b){
            return a-b
        }

        function mul(a,b){
            return a*b
        }

        function div(a,b){
            return a/b
        }

        // 버튼마다 달라지는 것(버튼 id, 기호, 함수)만 표로 모아 둔다.
        var operations = [
            { id: 'plus',  symbol: '+', fn: plus },
            { id: 'minus', symbol: '-', fn: minus },
            { id: 'mul',   symbol: 'x', fn: mul },
            { id: 'div',   symbol: '/', fn: div }
        ];

        // head 안에서는 body가 아직 없으므로, 문서가 다 읽힌 뒤에 버튼에 이벤트를 연결한다.
        document.addEventListener('DOMContentLoaded', function () {
            operations.forEach(function (op) {
                document.querySelector('button#' + op.id).addEventListener('click', function () {
                    // input 의 값은 문자열이므로 Number() 로 숫자로 바꿔야 이어붙이지 않고 계산된다.
                    var a = Number(document.querySelector('input#a').value);
                    var b = Number(document.querySelector('input#b').value);
                    document.querySelector('#result').textContent = a + ' ' + op.symbol + ' ' + b + ' = ' + op.fn(a,b);
                });
            });
        });
    </script>
</head>
<body>
    안녕하세요
    <h1>
        반갑습니다
    </h1>
    <h2>
        반갑습니다
    </h2>
    <input id="a" type="number" placeholder="첫 번째 숫자">
    <input id="b" type="number" placeholder="두 번째 숫자">
    <button id="plus">+</button>
    <button id="minus">-</button>
    <button id="mul">x</button>
    <button id="div">/</button>
    <p id="result"></p>
</body>
</html>
