<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>픽사베이 이미지 슬라이더</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; max-width: 720px; margin: 0 auto; padding: 1rem; }
    .row { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; }
    input { flex: 1; padding: 0.5rem; font-size: 1rem; }
    button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
    #msg { color: #c0392b; min-height: 1.5rem; }
    .slider { position: relative; background: #111; border-radius: 10px; overflow: hidden; display: none; }
    .slider img { width: 100%; height: 420px; object-fit: contain; display: block; }
    .nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,.8); border: 0; border-radius: 50%; width: 2.5rem; height: 2.5rem; }
    #prev { left: 8px; } #next { right: 8px; }
    .info { display: none; justify-content: space-between; align-items: center; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <h1>🖼️ 이미지 검색 슬라이더</h1>

  <div class="row">
    <input id="key" type="password" placeholder="Pixabay API 키 붙여넣기">
  </div>
  <div class="row">
    <input id="q" placeholder="검색어 (예: 제주 감귤, tangerine)">
    <button id="search">검색</button>
  </div>
  <div id="msg"></div>

  <div class="slider" id="slider">
    <button class="nav" id="prev">◀</button>
    <img id="img" alt="">
    <button class="nav" id="next">▶</button>
  </div>
  <div class="info" id="info">
    <span id="pos"></span>
    <button id="more">다음 10개 불러오기</button>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    let images = [], idx = 0, page = 1, query = '';

    async function load() {
      const key = $('key').value.trim();
      if (!key || !query) { $('msg').textContent = 'API 키와 검색어를 입력하세요.'; return; }
      $('msg').textContent = '불러오는 중...';
      const url = 'https://pixabay.com/api/?' + new URLSearchParams({
        key, q: query, image_type: 'photo', per_page: 10, page, lang: 'ko'
      });
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(res.status === 400 ? 'API 키가 올바르지 않습니다.' : '요청 실패 (' + res.status + ')');
        const data = await res.json();
        if (!data.hits.length) { $('msg').textContent = '검색 결과가 없습니다.'; return; }
        images = data.hits; idx = 0;
        $('msg').textContent = '';
        show();
      } catch (e) {
        $('msg').textContent = e.message;
      }
    }

    function show() {
      $('slider').style.display = 'block';
      $('info').style.display = 'flex';
      $('img').src = images[idx].webformatURL;
      $('img').alt = images[idx].tags;
      $('pos').textContent = `${idx + 1} / ${images.length} (페이지 ${page}) · ${images[idx].tags}`;
    }

    $('search').onclick = () => { query = $('q').value.trim(); page = 1; load(); };
    $('q').addEventListener('keydown', e => { if (e.key === 'Enter') $('search').click(); });
    $('prev').onclick = () => { idx = (idx - 1 + images.length) % images.length; show(); };
    $('next').onclick = () => { idx = (idx + 1) % images.length; show(); };
    $('more').onclick = () => { page++; load(); };
  </script>
</body>
</html>
